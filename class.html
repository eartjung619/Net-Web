  <style>
    /* ใช้ฟอนต์ Prompt เฉพาะเนื้อหาหน้า (ไม่รวม navbar) */
main,
#viewerModal {
  font-family: 'Prompt', sans-serif;

}
main button,
main input,
#viewerModal button {
  font-family: inherit;
}

    /* ===== navbar: จุดเด่นของลิงก์ที่ active ===== */
    .navbar .nav-link { border-bottom: 3px solid transparent; transition: all .2s; }
    .navbar .nav-link:hover { color: #ffd966; }
    .navbar .nav-link.active {
      color: #ffd966 !important;
      font-weight: 600;
      border-bottom: 3px solid #ffd966;
    }

    /* ===== หัวข้อหน้า ===== */
    .page-head { margin: 2.5rem 0 1.5rem; }
    .page-head h1 { color: #800000; font-weight: 700; }
    .page-head p  { color: #6c757d; margin-bottom: 0; }

    /* ===== แท็บสลับระหว่างหน้าระดับ ===== */
    .level-tabs a {
      display: inline-block;
      border: 2px solid #800000;
      border-radius: 2rem;
      padding: .4rem 1.4rem;
      font-weight: 600;
      color: #800000;
      text-decoration: none;
      transition: all .2s;
    }
    .level-tabs a:hover { background: #f6eaea; }
    .level-tabs a.active { background: #800000; color: #fff; }
    .level-tabs a:focus-visible { outline: 3px solid #ffd966; outline-offset: 2px; }

    /* ===== การ์ดสาขา ===== */
    .major-card {
      border: 1px solid #e6dcdc;
      border-radius: 1rem;
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .major-card:hover {
      box-shadow: 0 .5rem 1.25rem rgba(128, 0, 0, .15);
      transform: translateY(-3px);
    }

    /* ภาพปกในการ์ด (คลิกเพื่อดูภาพทั้งหมด) */
    .cover-btn {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: #efe6e6;
      cursor: pointer;
      overflow: hidden;
    }
    .cover-btn img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;   /* ปรับสัดส่วนภาพตรงนี้ */
      object-fit: cover;
      object-position: center;
      transition: transform .3s;
    }
    .cover-btn:hover img { transform: scale(1.04); }
    .cover-btn:focus-visible { outline: 3px solid #ffd966; outline-offset: -3px; }
    .cover-badge {
      position: absolute;
      right: .75rem;
      bottom: .75rem;
      background: rgba(0, 0, 0, .7);
      color: #fff;
      border-radius: 2rem;
      padding: .25rem .75rem;
      font-size: .85rem;
    }

    /* หน้าต่างดูภาพใหญ่ */
    #viewerModal .carousel-item img {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      background: #000;
    }

    /* ป้ายระดับในการ์ด */
    .level-tag {
      display: inline-block;
      border-radius: .4rem;
      padding: .1rem .6rem;
      font-size: .8rem;
      font-weight: 700;
      margin-right: .35rem;
    }
    .level-tag.vc  { background: #800000; color: #fff; }
    .level-tag.hvc { background: #ffd966; color: #5c0000; }

    .major-card .card-title { color: #800000; font-weight: 600; font-size: 1.1rem; }
    .major-card .card-text  { color: #555; line-height: 1.75; font-size: .95rem; }
  </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg shadow-sm" data-bs-theme="dark" style="background-color: #800000;">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center" href="firstpage.html">
      <img src="./Images/Logo-NET.png" alt="Logo" height="50" class="me-2">
      <span class="fw-semibold text-light">วิทยาลัยเทคโนโลยีภาคตะวันออกเฉียงเหนือ</span>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-3">
        <li class="nav-item"><a class="nav-link" href="register.html">สมัครเรียน</a></li>
        <li class="nav-item"><a class="nav-link" href="class.html">หลักสูตรที่เปิดสอน</a></li>
        <li class="nav-item">
          <a class="nav-link" href="https://netc.sisacloud.com/" target="_blank" rel="noopener noreferrer">
            Sisa <i class="bi bi-box-arrow-up-right small"></i>
          </a>
        </li>
        <li class="nav-item"><a class="nav-link" href="about.html">ติดต่อเรา</a></li>
      </ul>

      <form class="d-flex mx-lg-3 mb-2 mb-lg-0" role="search">
        <input class="form-control me-2" type="search" placeholder="ค้นหา..." aria-label="Search">
        <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
      </form>

      <div class="d-flex align-items-center gap-3 fs-5">
        <div class="dropdown">
          <button class="btn btn-link text-white p-0 fs-5" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false" title="เอกสารดาวน์โหลด">
            <i class="bi bi-file-earmark-text"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="https://drive.google.com/drive/folders/1XTFbJcsvLQjKqA91GMtvhPvzMCY0NXLR?usp=sharing" target="_blank" rel="noopener noreferrer">
               <i class="bi bi-file-earmark-pdf me-2"></i>เอกสารนักศึกษา</a></li>

            <li><a class="dropdown-item" href="https://drive.google.com/drive/folders/1V5HM08kMsxBm9rwfMmq0HdB7_y5Mnrms?usp=sharing" target="_blank" rel="noopener noreferrer">
               <i class="bi bi-file-earmark-pdf me-2"></i>เอกสารครู-บุคลากร</a></li>
          </ul>
        </div>
        
      </div>

    </div>
  </div>
</nav>

<!-- ===== เนื้อหาหน้า ===== -->
<main class="container pb-5">

  <div class="page-head">
    <h1>หลักสูตรที่เปิดสอน</h1>
    <p>เลือกดูรายละเอียดของแต่ละสาขาวิชาที่เปิดสอนในวิทยาลัย</p>
  </div>

  <!-- แท็บสลับหน้า -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
    <nav class="level-tabs d-flex flex-wrap gap-2" aria-label="เลือกระดับ">
      <a href="class.html" class="active" aria-current="page">ทั้งหมด</a>
      <a href="class1.html">ปวช.</a>
      <a href="class2.html">ปวส.</a>
      <a href="class3.html">รอบคนทำงาน</a>
    </nav>
    <span class="ms-md-auto text-muted small" id="filterCount"></span>
  </div>

  <!-- การ์ดทั้ง 9 สาขา ถูกสร้างจากข้อมูลด้านล่าง -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="majorGrid"></div>

</main>

<!-- ===== หน้าต่างดูภาพใหญ่ (ใช้ร่วมกันทุกสาขา) ===== -->
<div class="modal fade" id="viewerModal" tabindex="-1" aria-labelledby="viewerTitle" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header border-secondary">
        <h2 class="modal-title fs-5" id="viewerTitle"></h2>
        <span class="ms-3 small text-white-50" id="viewerCount"></span>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="ปิด"></button>
      </div>
      <div class="modal-body p-0">
        <div id="viewerCarousel" class="carousel slide">
          <div class="carousel-inner" id="viewerInner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#viewerCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">ก่อนหน้า</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#viewerCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">ถัดไป</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  /* =====================================================
     ข้อมูล 9 สาขา  (แก้ข้อมูลเฉพาะตรงนี้)
     - name   : ชื่อสาขา
     - levels : ระดับที่เปิดรับ  ["ปวช."]  หรือ  ["ปวส."]  หรือทั้งคู่  ["ปวช.", "ปวส."]
     - images : รายชื่อภาพสไลด์ของสาขานั้น (ใส่กี่รูปก็ได้)
     - desc   : คำอธิบายการเรียนของสาขานี้
     ===================================================== */

  const majors = [
    {
      name: "สาขาวิชาที่ 1",
      levels: ["ปวช.", "ปวส."],
      images: ["images/major1-1.png", "images/major1-2.png", "images/major1-3.png", "images/major1-4.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 2",
      levels: ["ปวช.", "ปวส."],
      images: ["images/major2-1.png", "images/major2-2.png", "images/major2-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 3",
      levels: ["ปวช.", "ปวส."],
      images: ["images/major3-1.png", "images/major3-2.png", "images/major3-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 4",
      levels: ["ปวช."],
      images: ["images/major4-1.png", "images/major4-2.png", "images/major4-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 5",
      levels: ["ปวช."],
      images: ["images/major5-1.png", "images/major5-2.png", "images/major5-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 6",
      levels: ["ปวช."],
      images: ["images/major6-1.png", "images/major6-2.png", "images/major6-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 7",
      levels: ["ปวส."],
      images: ["images/major7-1.png", "images/major7-2.png", "images/major7-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 8",
      levels: ["ปวส."],
      images: ["images/major8-1.png", "images/major8-2.png", "images/major8-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    },
    {
      name: "สาขาวิชาที่ 9",
      levels: ["ปวส."],
      images: ["images/major9-1.png", "images/major9-2.png", "images/major9-3.png"],
      desc: "พิมพ์รายละเอียดการเรียนของสาขานี้ที่นี่ เช่น เรียนเกี่ยวกับอะไร ได้ฝึกทักษะอะไร และจบแล้วประกอบอาชีพอะไรได้"
    }
  ];

  /* ภาพสำรอง: ถ้าหาไฟล์ภาพไม่เจอ จะแสดงกรอบสีชมพูอ่อนแทน */
  const fallback = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450">' +
    '<rect width="100%" height="100%" fill="#efe6e6"/>' +
    '<text x="50%" y="50%" fill="#800000" font-size="28" text-anchor="middle" ' +
    'dominant-baseline="middle" font-family="sans-serif">ใส่ภาพที่นี่</text></svg>'
  );

  /* สร้างการ์ดแต่ละใบ (แสดงภาพแรกเป็นภาพปก) */
  const grid = document.getElementById("majorGrid");

  majors.forEach((m, i) => {
    const n = m.images.length;
    const tags = m.levels.map(l => `<span class="level-tag ${l === "ปวส." ? "hvc" : "vc"}">${l}</span>`).join("");
    const label = n > 1 ? `ดูภาพทั้งหมด (${n})` : "ดูภาพขยาย";

    grid.insertAdjacentHTML("beforeend", `
      <div class="col">
        <article class="card major-card h-100">
          <button type="button" class="cover-btn" data-index="${i}" aria-label="${label} ${m.name}">
            <img src="${m.images[0]}" alt="${m.name}" loading="lazy"
                 onerror="this.onerror=null;this.src='${fallback}'">
            <span class="cover-badge"><i class="bi bi-images me-1"></i>${label}</span>
          </button>
          <div class="card-body">
            <div class="mb-2">${tags}</div>
            <h3 class="card-title">${m.name}</h3>
            <p class="card-text mb-0">${m.desc}</p>
          </div>
        </article>
      </div>`);
  });

  /* แสดงจำนวนสาขาทั้งหมด */
  document.getElementById("filterCount").textContent = `แสดง ${majors.length} สาขา`;

  /* หน้าต่างดูภาพใหญ่ */
  const viewerEl = document.getElementById("viewerModal");
  const viewerCarousel = document.getElementById("viewerCarousel");
  const viewerInner = document.getElementById("viewerInner");
  const viewerTitle = document.getElementById("viewerTitle");
  const viewerCount = document.getElementById("viewerCount");
  const viewerArrows = viewerCarousel.querySelectorAll(".carousel-control-prev, .carousel-control-next");
  const viewer = new bootstrap.Modal(viewerEl);
  let total = 0;

  function openViewer(i) {
    const m = majors[i];
    total = m.images.length;
    viewerTitle.textContent = m.name;
    viewerCount.textContent = total > 1 ? `1 / ${total}` : "";
    viewerInner.innerHTML = "";

    m.images.forEach((src, k) => {
      const item = document.createElement("div");
      item.className = "carousel-item" + (k === 0 ? " active" : "");
      const img = document.createElement("img");
      img.src = src;
      img.alt = `${m.name} ภาพที่ ${k + 1}`;
      img.onerror = () => { img.onerror = null; img.src = fallback; };
      item.appendChild(img);
      viewerInner.appendChild(item);
    });

    viewerArrows.forEach(btn => btn.style.display = total > 1 ? "" : "none");
    viewer.show();
  }

  grid.addEventListener("click", e => {
    const btn = e.target.closest(".cover-btn");
    if (btn) openViewer(Number(btn.dataset.index));
  });

  viewerCarousel.addEventListener("slid.bs.carousel", e => {
    viewerCount.textContent = `${e.to + 1} / ${total}`;
  });

  /* ใส่ active ให้ลิงก์ของหน้าปัจจุบัน */
  const currentPage = location.pathname.split("/").pop();
  document.querySelectorAll("#mainNav .nav-link").forEach(link => {
    if (link.getAttribute("href") === currentPage) {
      link.classList.add("active");
      link.setAttribute("aria-current", "page");
    }
  });
</script>
</body>
</html>
